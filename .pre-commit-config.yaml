default_language_version:
  python: python3.11

default_stages: [ pre-commit, pre-push,commit, push ]

default_install_hook_types: [ pre-commit, pre-push, post-checkout, post-merge, post-rewrite ]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: name-tests-test
        args: [ --pytest-test-first ]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.1.15'  # Try to match uv.lock version
    hooks:
      - id: ruff
        args: [ --fix, --exit-non-zero-on-fix ]
        types_or: [ python, pyi, jupyter ]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 23.10.1  # Try to match uv.lock version
    hooks:
      - id: black

  - repo: https://github.com/MarcoGorelli/auto-walrus
    rev: v0.2.2
    hooks:
      - id: auto-walrus

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.6.1  # Try to match uv.lock version
    hooks:
      - id: mypy

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock
      - id: uv-sync
