[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"


[project]
name = "pyproject-version-sync"
version = "0.2.1"
description = "Pre-commit hook to align the pyproject.toml version to the latest tag in the repo."
readme = "README.md"
authors = [
    { name = "Eshwen Bhal, PhD", email = "milanman.eshb@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "tomli>=2.5.0,<2.6",
    "typer>=0.27.2,<0.28",
]


[project.scripts]
sync_pyproject_version = "pyproject_version_sync.sync_pyproject_version:main"


[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "type" },
]

lint = [
    "pre-commit>=4.7.0,<5",
    "ruff>=0.17.3,<0.18",
]
type = [
    "pyrefly~=1.4.0",
]


[tool.uv]
required-version = ">=0.13.0,<0.14"


[tool.hatch.build.targets.sdist]
include = ["/pyproject_version_sync"]


[tool.ruff]
line-length = 120
target-version = "py311"

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "venv",
    "node_modules",
    ".git",
    "__pycache__",
]


[tool.ruff.lint]
select = [
    "I",
    "D",
    "E",
    "F",
    "W",
    "C90",
    "N",
    "UP",
    "S",
    "BLE",
    "FBT",
    "B",
    "A",
    "COM",
    "C4",
    "T10",
    "EM",
    "EXE",
    "ISC",
    "ICN",
    "G",
    "INP",
    "PIE",
    "T20",
    "PT",
    "Q",
    "RET",
    "SIM",
    "TID",
    "ARG",
    "PTH",
    "ERA",
    "PD",
    "PGH",
    "PL",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "TRY",
    "RUF"
]

ignore = [
    "D301",
    "D212",
    "D107",
    "D407",
    "D203",
    "PGH003",
    "A003",
    "N805",
    "ARG002",
    "ARG001",
    "G004",
    "EM101",
    "TRY003",
    "EM102",
    "B008",
    "COM812",
    "FBT002",
    "FBT001"
]


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.format]
# Like Black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.pyrefly]
preset = "strict"
project-includes = ["pyproject_version_sync"]
python-interpreter-path = ".venv/bin/python3"
python-version = "3.11"


[tool.pyrefly.errors]
implicit-any-type-argument = "ignore"
missing-override-decorator = "ignore"
missing-source = "warn"
string-as-iterable = "warn"
unannotated-return = "error"
