[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"


[project]
name = "pyproject-version-sync"
version = "0.2.1"
description = "Pre-commit hook to align the pyproject.toml version to the latest tag in the repo."
readme = "README.md"
authors = [
    { name = "Eshwen Bhal, PhD", email = "milanman.eshb@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "tomli>=2.0.1,<2.1",
]


[project.scripts]
sync_pyproject_version = "pyproject_version_sync.sync_pyproject_version:main"


[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "type" },
]

lint = [
    "pre-commit>=3.5.0,<3.6",
    "ruff>=0.17.3,<0.18",
]
type = [
    "mypy>=1.6.1,<1.7",
]


[tool.uv]
required-version = ">=0.13.0,<0.14"


[tool.hatch.build.targets.sdist]
include = ["/pyproject_version_sync"]


[tool.ruff]
line-length = 120
target-version = "py311"

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "venv",
    "node_modules",
    ".git",
    "__pycache__",
]


[tool.ruff.lint]
select = [
    "I",
    "D",
    "E",
    "F",
    "W",
    "C90",
    "N",
    "UP",
    "S",
    "BLE",
    "FBT",
    "B",
    "A",
    "COM",
    "C4",
    "T10",
    "EM",
    "EXE",
    "ISC",
    "ICN",
    "G",
    "INP",
    "PIE",
    "T20",
    "PT",
    "Q",
    "RET",
    "SIM",
    "TID",
    "ARG",
    "PTH",
    "ERA",
    "PD",
    "PGH",
    "PL",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "TRY",
    "RUF"
]

ignore = [
    "D301",
    "D212",
    "D107",
    "D407",
    "D203",
    "PGH003",
    "A003",
    "N805",
    "ARG002",
    "ARG001",
    "G004",
    "EM101",
    "TRY003",
    "EM102",
    "B008",
    "COM812",
    "FBT002",
    "FBT001"
]


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.format]
# Like Black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.mypy]
python_version = "3.11"
pretty = true
show_traceback = true
color_output = true
allow_redefinition = false
check_untyped_defs = true
disallow_any_generics = true
allow_untyped_defs = false
allow_incomplete_defs = false
ignore_missing_imports = true
disable_error_code = "type-arg"
implicit_reexport = true
no_implicit_optional = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
strict_equality = true
strict_optional = false
warn_no_return = true
warn_redundant_casts = true
warn_return_any = false
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
